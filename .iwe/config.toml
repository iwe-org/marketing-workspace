version = 3

[markdown]
refs_extension = ".md"
date_format = "%b %d, %Y"

[markdown.formatting]
wrap_column = 80

[library]
path = ""
date_format = "%Y-%m-%d"
frontmatter_document_title = "title"

[completion]

[templates.default]
key_template = "{{slug}}"
document_template = """
# {{title}}

{{content}}"""

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.link]
type = "link"
title = "Link"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.sort]
type = "sort"
title = "Sort A-Z"
reverse = false

# Document-schema bindings. Each entry names a schema file in .iwe/schemas/<name>.yaml
# and a key-glob (or list) that binds it. Bindings are BY PATH, not by frontmatter
# `type`, and ALL matching schemas apply to a document — globs are written to be
# mutually exclusive. Run: iwe schema validate  (--explain shows the binding trace).

[schemas.post]
match = "data/{posts,drafts}/**"

[schemas.template]
match = "data/evergreen/[a-z]*"

# flat community-* for standalone sites; platform subfolders (communities/reddit/*)
# group venues that share one platform, mirroring the posts/<platform>/ convention.
# The extension-less hub key data/communities matches neither glob and binds to hub.
[schemas.community]
match = ["data/community-*", "data/communities/*/*"]

# person: everything under data/people/ EXCEPT role-* (those are hubs). A `!`
# prefix negates a pattern gitignore-style — within one list the last matching
# pattern decides.
[schemas.person]
match = ["data/people/*", "!data/people/role-*"]

[schemas.mention]
match = "data/mentions/*"

[schemas.interview]
match = "data/interviews/*"

[schemas.external]
match = "data/external-*"

[schemas.plan]
match = "data/plan/[a-z]*"

[schemas.task]
match = "data/backlog/[a-z]*"

[schemas.competitor]
match = "data/competitors/[a-z]*"

[schemas.experiment]
match = "data/experiments/[a-z]*"

[schemas.hub]
match = [
  "data/communities",
  "data/people",
  "data/mentions",
  "data/interviews",
  "data/competitors",
  "data/experiments",
  "data/people/role-*",
  "data/pillars/*",
]

[schemas.tracker]
match = [
  "SCHEMA",
  "data/product",
  "data/strategy",
  "data/plan",
  "data/backlog",
  "data/metrics",
  "data/brand",
  "data/website",
  "data/offer",
]

# OKF v0.2 conformance (SPEC §11). okf stacks on top of the per-type schemas and
# catches any document arriving without a type; okf-index and okf-log check the
# body shapes of the reserved files, which a frontmatter-only check cannot see.
# The bundle root is data/, so these bind under data/ only.
[schemas.okf]
match = [
  "data/**",
  "!data/index",
  "!data/**/index",
  "!data/log",
  "!data/**/log",
]

[schemas.okf-index]
match = ["data/index", "data/**/index"]

[schemas.okf-log]
match = ["data/log", "data/**/log"]
