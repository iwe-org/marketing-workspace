$schema: https://document-schema.org/draft/2026-06/schema
description: a durable campaign note (data/notes/<slug>.md) — a decision, learning or gotcha a future session would be worse off not knowing. Short by design; anything longer belongs in a reading or an experiment
frontmatter:
  type: object
  required: [type, kind, stage, origin, created]
  additionalProperties: false
  properties:
    type: { const: note }
    title: { type: string }
    kind:
      enum: [decision, learning, gotcha]
      description: decision = a choice the user made, and why; learning = a durable fact no other document records; gotcha = a trap that cost time, with its symptom and the way around it
    stage:
      enum: [active, superseded]
      description: superseded when a newer note or another document replaced it — notes are never deleted
    origin:
      enum: [human, agent]
      description: human when the user stated it, agent when inferred from the work
    created: { type: string, format: date, description: the date the fact came about, not the date it was written down }
    resource:
      type: string
      description: canonical URI of the underlying asset this document describes (SPEC §4.1)
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and index entries show
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4), derived from stage — set it only for the draft and deprecated cases in SCHEMA.md; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a bundle path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
  if: { properties: { kind: { const: decision } }, required: [kind] }
  then:
    properties: { origin: { const: human } }
    description: only the user makes decisions, so kind decision requires origin human
maxTokens: 400
maxDepth: 2
sections:
  - header: { pattern: '.' }
    maxContains: 1
additionalSections: false
