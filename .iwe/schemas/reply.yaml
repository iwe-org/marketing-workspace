$schema: https://document-schema.org/draft/2026-06/schema
description: one comment you posted in someone else's thread (data/replies/YYYY-MM-DD-<platform>-<slug>.md) — what was asked, what you said, and how it landed; the thread page inclusion-links it, and its Context opens with a link to the person it answered. Replies under your own posts stay in that post's body
frontmatter:
  type: object
  required: [type, stage, platform, resource, answers, names_product, origin, goal, published, created]
  additionalProperties: false
  properties:
    type: { const: reply }
    title: { type: string, description: kept only when the H1 does not carry the title }
    stage:
      enum: [published, removed, deleted]
      description: published = live; removed = taken down by moderators or a spam filter; deleted = you deleted it yourself
    platform:
      enum: [reddit, hn, x.com, linkedin, threads, bluesky, mastodon, github, dev.to, indiehackers, producthunt, discord, slack, forum, other]
    resource: { type: string, description: permalink to your comment }
    answers:
      enum: [post, comment]
      description: post = a top-level answer to the thread itself; comment = an answer to someone's comment. Who it answered is the Person line in the body, not a field
    names_product:
      type: boolean
      description: true when the comment names or links your product — the promotion axis to compare outcomes against
    origin:
      enum: [human, agent, agent-edited]
      description: who wrote the words that went up — human = you wrote them; agent = posted as the agent drafted them; agent-edited = an agent draft you rewrote
    pillar: { type: [string, "null"], description: the messaging pillar the reply argues, if any }
    goal:
      enum: [awareness, conversion, positioning, credibility, retention]
      description: why you replied — the same axis as posts
    success: { type: string, description: optional one line naming the signal that means the reply worked }
    outcome:
      enum: [none, replied, asked, will-try, tried]
      description: the success measure, set at the three-day review and raised whenever the conversation moves — none = nobody engaged; replied = someone answered; asked = someone asked how the product works or where to get it; will-try = someone said they will try it; tried = someone reports using it. Score is context, not outcome
    reviewed: { type: string, format: date, description: date the outcome was last checked }
    published: { type: string, format: date, description: when the comment went up }
    created: { type: string, format: date, description: when you filed it }
    engagement:
      type: object
      additionalProperties: false
      properties:
        upvotes: { type: [integer, "null"], description: your comment's score }
        replies: { type: [integer, "null"], description: direct replies to your comment }
        thread_upvotes: { type: [integer, "null"], description: the thread's score at the last refresh, to read yours against }
        thread_comments: { type: [integer, "null"], description: the thread's comment count at the last refresh }
        notes: { type: string }
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and index entries show
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4), derived from stage — set it only for the draft and deprecated cases in SCHEMA.md; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a bundle path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
  if: { required: [outcome] }
  then:
    required: [reviewed]
    description: an outcome is a reading made on a date, so setting outcome requires reviewed
maxDepth: 3
sections:
  - header: { pattern: '.' }
    description: the H1 names the thread and the gist of the reply
    maxContains: 1
    sections:
      - header: { const: Context }
        description: opens with a Person line linking the lead or person answered (omitted only when the reply answered nobody in particular), then the thread page, the venue page (linked once — the replies hub charts count replies per venue from it), the comment answered, and what was literally asked
        maxContains: 1
      - header: { const: Our reply }
        description: the comment exactly as posted, as a quote
        maxContains: 1
      - header: { const: Discussion }
        description: optional; what the comment drew, newest last
        minContains: 0
        maxContains: 1
    additionalSections: false
additionalSections: false
