$schema: https://document-schema.org/draft/2026-06/schema
description: a competitor profile (data/competitors/<slug>.md) — the centralized source of truth for one competitor, refreshed via dated snapshots
frontmatter:
  type: object
  required: [type, stage, resource, created]
  additionalProperties: false
  properties:
    type: { const: competitor }
    title: { type: string }
    stage:
      enum: [active, dormant, archived]
      description: active = shipping; dormant = no visible release or change in about six months; archived = discontinued, or no longer worth tracking
    relation:
      enum: [direct, adjacent, incumbent, substitute]
      description: direct = same job for the same customer; adjacent = overlaps on one axis; incumbent = the established tool your customers come from; substitute = solves the job a different way (a spreadsheet, an agency, doing nothing)
    threat:
      enum: [high, medium, low]
      description: optional — how much it can take your customers or your story in the next two quarters; set it only with the reason written in the body, and leave it unset rather than guess
    watch:
      type: boolean
      description: true puts it in the weekly digest's competitor watch
    resource: { type: string }
    updated: { type: [string, "null"], format: date, description: date of the last snapshot/refresh }
    notes: { type: string, description: one-line stance — why this competitor matters }
    created: { type: string, format: date }
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and index entries show
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4), derived from stage — set it only for the draft and deprecated cases in SCHEMA.md; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a bundle path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
maxDepth: 3
sections:
  - header: { pattern: '.' }
    description: the H1 carries the competitor's name
    maxContains: 1
    sections:
      - header: { const: Positioning }
        maxContains: 1
      - header: { const: Pricing }
        maxContains: 1
      - header: { const: Strengths }
        description: what they are genuinely better at
        maxContains: 1
      - header: { const: Weaknesses }
        maxContains: 1
      - header: { const: Changelog }
        description: dated snapshots, newest first
        maxContains: 1
additionalSections: false
