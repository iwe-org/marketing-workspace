$schema: https://document-schema.org/draft/2026-06/schema
description: an atomic backlog task (data/backlog/<slug>.md) — a single-sitting executable
frontmatter:
  type: object
  required: [type, status, created]
  additionalProperties: false
  properties:
    type: { const: task }
    title: { type: string }
    status:
      enum: [planned, in-progress, done, blocked, discarded]
    priority:
      enum: [high, medium, low]
    effort: { type: [string, "null"], description: free-text estimate }
    completed: { type: [string, "null"], format: date }
    notes: { type: string }
    created: { type: string, format: date }
maxDepth: 3
