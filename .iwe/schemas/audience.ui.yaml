name: Audience
description: An audience segment you market to
columns: [stage, fit, pillar]
fields:
  type: { hidden: true }
  title: { hidden: true }
  status: { hidden: true }
  generated: { hidden: true }
  verified: { hidden: true }
  usage_window: { hidden: true }
  stage:
    title: Stage
    values:
