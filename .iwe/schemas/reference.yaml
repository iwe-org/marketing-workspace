$schema: https://document-schema.org/draft/2026-06/schema
description: outside material you may take ideas from (data/references/<slug>.md) — a video, article, post, talk or repo about how others market, with what it shows and the ideas you could use. Content about you or your category's thesis is type external instead
frontmatter:
  type: object
  required: [type, kind, stage, platform, resource, author, ideas_for, created]
  additionalProperties: false
  properties:
    type: { const: reference }
    title: { type: string, description: the material's title as published }
    kind:
      enum: [video, article, post, thread, talk, podcast, repo, newsletter, other]
    stage:
      enum: [new, reviewed, used, dropped]
      description: new = filed, not yet read or watched in full; reviewed = read, ideas written down; used = an idea went into a post, page or experiment, linked in the body; dropped = nothing to take
    platform:
      enum: [youtube, blog, newsletter, x.com, reddit, hn, linkedin, github, podcast, other]
    resource: { type: string, minLength: 1, description: canonical URL of the material }
    author: { type: string, minLength: 1, description: author or channel name as shown at the source }
    published: { type: [string, "null"], format: date }
    pillar: { type: [string, "null"] }
    ideas_for:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        enum: [content, format, positioning, product, offer, venue]
      description: what kind of idea it can feed — content (a post angle), format (how the material is made or titled), positioning (how to frame the product), product (a feature or onboarding step), offer (pricing or packaging), venue (the author or channel as a place to appear)
    sponsored: { type: boolean, description: the material carries a paid promotion }
    created: { type: string, format: date }
    description:
      type: string
      description: one sentence summarizing this document — what OKF consumers and index entries show
    tags: { type: array, items: { type: string } }
    status:
      enum: [draft, stable, deprecated]
      description: OKF lifecycle (SPEC §5.4), derived from stage — set it only for the draft and deprecated cases in SCHEMA.md; absent means stable
    stale_after:
      type: string
      format: date
      description: the day this content goes stale (SPEC §5.5); set it on anything that rots
    generated:
      type: object
      required: [by]
      description: how the current content was produced (SPEC §5.2) — write it on every edit
      properties:
        by: { type: string, description: "actor (SPEC §7) — <producer>/<version>, human:<id>, or process:<id>" }
        at: { type: string, description: ISO 8601 datetime of the last meaningful change }
    verified:
      description: who confirmed the content against its sources (SPEC §5.2); one mapping or a list
      anyOf:
        - $ref: '#/$defs/verification'
        - { type: array, items: { $ref: '#/$defs/verification' } }
    sources:
      type: array
      description: the materials this document derives from (SPEC §5.1); cite per claim with a footnote keyed to an entry id
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string, description: footnote label used to attribute a claim in the body }
          resource: { type: string, description: a URL, a bundle path, or a scope descriptor }
          title: { type: string }
          author: { type: string, description: actor (SPEC §7) }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      description: the date range every usage_count is measured over
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
  $defs:
    verification:
      type: object
      required: [by]
      properties:
        by: { type: string, description: "actor (SPEC §7)" }
        at: { type: string, description: ISO 8601 datetime }
maxDepth: 2
sections:
  - header: { pattern: '.' }
    description: the H1 carries the material's title as published
    maxContains: 1
    sections:
      - header: { const: What it is }
        description: who made it, where, when, and what it shows
        maxContains: 1
      - header: { const: Ideas we can use }
        description: each idea, saying whether it comes from the full material or only its summary
        maxContains: 1
      - header: { const: Source }
        description: the link, what was read or watched, and when
        maxContains: 1
    additionalSections: false
additionalSections: false
